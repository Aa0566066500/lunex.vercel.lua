<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b10">
    <meta name="description" content="Lunex Scripts - منصة إدارة وتنظيم سكربتات Lua">
    <title>Lunex Scripts</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="app">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Lunex Scripts">
                <span class="brand-mark">L</span>
                <span>Lunex <span class="brand-muted">Scripts</span></span>
            </a>

            <div class="account-area">
                <span id="user-status">غير مسجل الدخول</span>
                <button id="login-button" type="button">تسجيل الدخول</button>
                <button id="logout-button" type="button" hidden>تسجيل الخروج</button>
            </div>
        </header>

        <main class="main-content">
            <section class="hero">
                <p class="eyebrow">LUNEX SCRIPTS</p>
                <h1>إدارة سكربتاتك، <span>بكل سهولة.</span></h1>
                <p>احفظ سورسات Lua ونظّمها من مكان واحد.</p>
            </section>

            <section class="scripts-panel">
                <div class="section-heading">
                    <div>
                        <h2>السورسات</h2>
                        <p>إدارة السورسات الخاصة بك</p>
                    </div>
                    <button id="new-script-button" type="button">+ سورس جديد</button>
                </div>

                <form id="script-form" hidden>
                    <label for="script-title">اسم السورس</label>
                    <input id="script-title" name="title" type="text"
                           maxlength="120" required placeholder="اكتب اسم السورس">

                    <label for="script-source">الكود</label>
                    <textarea id="script-source" name="source" required
                              placeholder="الصق كود Lua هنا"></textarea>

                    <div class="form-actions">
                        <button type="submit">حفظ السورس</button>
                        <button id="cancel-script-button" type="button">إلغاء</button>
                    </div>
                </form>

                <p id="message" role="status" aria-live="polite"></p>
                <div id="scripts-list"></div>
            </section>
        </main>

        <footer>
            <p>© <span id="current-year"></span> Lunex Scripts</p>
        </footer>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
